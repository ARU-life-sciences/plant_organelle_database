# Conda/mamba environment covering every third-party bioinformatics tool
# this pipeline depends on, plus the external tools `poa` (the gene-calling/
# editing/trans-splicing/GFF3-export package this repo's own annotation was
# retired in favor of - see README.md) needs at full-dataset scale. `poa`
# itself isn't on bioconda yet (name collision with an unrelated, existing
# `poa` package - Partial Order Alignment) - see install.sh, which pip
# installs it from the sibling `plant_organelle_annotator` checkout.
#
# Versions pinned to what this pipeline was built and validated against
# (checked directly via `<tool> --version` on the reference install, not
# copied from any install doc). Newer patch/minor versions will likely
# work but haven't been verified.
name: plant_organellar_database
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - matplotlib

  # assembly graph / alignment / general sequence tools
  - minimap2=2.28
  - samtools=1.21
  - seqkit=2.10.0
  - blast=2.16.0
  - cd-hit=4.8.1
  - mafft=7.525
  - gfatools=0.5

  # phylogenetics
  - iqtree=2.4.0

  # organelle gene-family / RNA / rRNA calling (poa's denovo_annotation stage)
  - hmmer=3.4
  - trnascan-se=2.0.12

  # assembly graph linearisation/resolution (linearize/) and gene-boundary
  # correction / spliced-gene reconstruction (poa's editing/trans_splicing
  # stages)
  - gfatk=0.6.1
  - orfedit=0.1.0
  - transsplice=0.2.1

  # assembly graph visualisation (linearize/'s gfatk-resolve fallback tier)
  - bandage=0.9.0
  - graphaligner=1.0.19

  - pip
  - pip:
      # not packaged on conda - source: https://github.com/marekborowiec/AMAS
      - amas
